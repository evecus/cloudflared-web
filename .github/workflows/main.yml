name: Build Linux Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Ensure go.mod exists
        run: |
          if [ ! -f go.mod ]; then
            go mod init cloudflared-web
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          OUT=dist/cloudflared-web-${{ matrix.suffix }}
          go build -trimpath -ldflags="-s -w" -o "$OUT" .
          chmod +x "$OUT"

      - name: Compute checksum
        run: |
          cd dist
          sha256sum cloudflared-web-${{ matrix.suffix }} > cloudflared-web-${{ matrix.suffix }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-web-${{ matrix.suffix }}
          path: |
            dist/cloudflared-web-${{ matrix.suffix }}
            dist/cloudflared-web-${{ matrix.suffix }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: test
          files: dist/*
          generate_release_notes: true
